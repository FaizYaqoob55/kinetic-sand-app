<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>SandTable</title>
    <style>
      /* ── Global reset for React Native Web ── */
      *, *::before, *::after {
        box-sizing: border-box;
      }

      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #080808;
        overflow: hidden;
      }

      #root {
        display: flex;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      /* React Native Web wraps everything in divs — ensure they stretch */
      #root > div {
        width: 100% !important;
        height: 100% !important;
        overflow: hidden !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
